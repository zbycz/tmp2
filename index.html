<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cvičební timer</title>
<style>
  :root {
    --bg: #10151c;
    --panel: #18202b;
    --fg: #f2f6fb;
    --muted: #8ea0b5;
    --accent: #45d18a;
    --accent-2: #f0b429;
    --ring: #253243;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    text-align: center;
    -webkit-user-select: none;
    user-select: none;
  }
  h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0; }
  #stage { font-size: 1.5rem; font-weight: 600; color: var(--accent-2); min-height: 1.6em; }
  #time {
    font-size: clamp(5rem, 32vw, 14rem);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.03em;
  }
  #progress { width: min(520px, 90vw); height: 10px; background: var(--ring); border-radius: 999px; overflow: hidden; }
  #bar { height: 100%; width: 0%; background: var(--accent); transition: width .2s linear; }
  #dots { display: flex; gap: 10px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--ring); }
  .dot.done { background: var(--accent); }
  .dot.active { background: var(--accent-2); box-shadow: 0 0 0 5px rgba(240,180,41,.18); }
  button {
    font: inherit;
    font-size: 1.5rem;
    font-weight: 700;
    padding: 24px 48px;
    min-width: min(420px, 90vw);
    border: 0;
    border-radius: 20px;
    background: var(--accent);
    color: #06210f;
    cursor: pointer;
  }
  button:active { transform: translateY(2px); }
  button.secondary { background: var(--panel); color: var(--fg); font-size: 1rem; font-weight: 600; padding: 14px 28px; min-width: 0; }
  #controls { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #hint { font-size: .85rem; line-height: 1.45; color: var(--muted); max-width: 34ch; }
  #hint:empty { display: none; }
</style>
</head>
<body>
  <h1>Cvičební timer</h1>
  <div id="stage">Připraven</div>
  <div id="time">40</div>
  <div id="progress"><div id="bar"></div></div>
  <div id="dots"></div>
  <div id="controls">
    <button id="main">Začít cyklus</button>
    <button id="reset" class="secondary" hidden>Reset</button>
  </div>
  <div id="hint"></div>

<script>
const WORK = 40;
const EXERCISES = 2;
const REPS = 2;

const steps = [];
for (let e = 1; e <= EXERCISES; e++) {
  for (let r = 1; r <= REPS; r++) {
    steps.push({ exercise: e, rep: r, last: r === REPS });
  }
}

const timeEl = document.getElementById('time');
const stageEl = document.getElementById('stage');
const barEl = document.getElementById('bar');
const dotsEl = document.getElementById('dots');
const mainBtn = document.getElementById('main');
const resetBtn = document.getElementById('reset');

steps.forEach(() => {
  const d = document.createElement('div');
  d.className = 'dot';
  dotsEl.appendChild(d);
});
const dots = [...dotsEl.children];

const AudioCtx = window.AudioContext || window.webkitAudioContext;
const isApple = /iP(hone|ad|od)/.test(navigator.userAgent) ||
  (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));

let audioCtx = null;
let silentLoop = null;
let audioReady = false;

function wavUrl(freq, seconds, amp) {
  const rate = 44100;
  const n = Math.round(rate * seconds);
  const view = new DataView(new ArrayBuffer(44 + n * 2));
  const ascii = (off, text) => { for (let i = 0; i < text.length; i++) view.setUint8(off + i, text.charCodeAt(i)); };
  ascii(0, 'RIFF'); view.setUint32(4, 36 + n * 2, true); ascii(8, 'WAVEfmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true);
  view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  ascii(36, 'data'); view.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const t = i / rate;
    const env = Math.max(0, Math.min(1, t * 120, (seconds - t) * 60));
    view.setInt16(44 + i * 2, Math.round(32767 * amp * env * Math.sin(2 * Math.PI * freq * t)), true);
  }
  return URL.createObjectURL(new Blob([view.buffer], { type: 'audio/wav' }));
}

function pool(url, size) {
  return Array.from({ length: size }, () => {
    const el = new Audio(url);
    el.preload = 'auto';
    el.playsInline = true;
    return el;
  });
}

const tones = { 880: pool(wavUrl(880, 0.2, 0.9), 3), 1200: pool(wavUrl(1200, 0.2, 0.9), 3) };
const cursors = { 880: 0, 1200: 0 };

function htmlTone(freq) {
  const list = tones[freq];
  const el = list[cursors[freq]++ % list.length];
  try { el.currentTime = 0; } catch (e) {}
  const played = el.play();
  if (played) played.catch(() => {});
}

function webAudioTone(freq) {
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.2);
}

function tone(freq) {
  if (audioCtx && audioCtx.state === 'running') {
    webAudioTone(freq);
    return;
  }
  if (audioCtx) audioCtx.resume().catch(() => {});
  htmlTone(freq);
}

function beep(count) {
  const freq = count > 1 ? 1200 : 880;
  for (let i = 0; i < count; i++) {
    if (i === 0) tone(freq);
    else setTimeout(() => tone(freq), i * 250);
  }
}

function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}

  if (!silentLoop) {
    silentLoop = new Audio(wavUrl(1, 1, 0.0002));
    silentLoop.loop = true;
    silentLoop.playsInline = true;
    silentLoop.preload = 'auto';
  }
  const loop = silentLoop.play();
  if (loop) loop.catch(() => {});

  Object.values(tones).flat().forEach(el => {
    const played = el.play();
    if (played) played.then(() => { el.pause(); el.currentTime = 0; }).catch(() => {});
  });

  if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
  if (audioCtx) {
    audioCtx.resume().catch(() => {});
    const src = audioCtx.createBufferSource();
    src.buffer = audioCtx.createBuffer(1, 1, 22050);
    src.connect(audioCtx.destination);
    src.start(0);
  }
  audioReady = true;
}

function stopSilentLoop() {
  if (silentLoop) silentLoop.pause();
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !audioReady) return;
  if (audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
  if (running && silentLoop && silentLoop.paused) {
    const loop = silentLoop.play();
    if (loop) loop.catch(() => {});
  }
});

let index = 0;
let deadline = 0;
let ticker = null;
let running = false;

function render(remaining, step) {
  timeEl.textContent = remaining;
  barEl.style.width = (100 * (WORK - remaining) / WORK) + '%';
  stageEl.textContent = step ? `Cvik ${step.exercise} / ${EXERCISES} · opakování ${step.rep} / ${REPS}` : 'Připraven';
  dots.forEach((d, i) => {
    d.classList.toggle('done', i < index);
    d.classList.toggle('active', running && i === index);
  });
}

function startStep() {
  const step = steps[index];
  deadline = Date.now() + WORK * 1000;
  render(WORK, step);
  ticker = setInterval(() => {
    const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    render(remaining, step);
    if (remaining <= 0) {
      clearInterval(ticker);
      ticker = null;
      finishStep(step);
    }
  }, 100);
}

function finishStep(step) {
  beep(step.last ? 3 : 1);
  index++;
  if (index < steps.length) {
    startStep();
  } else {
    running = false;
    stopSilentLoop();
    stageEl.textContent = 'Hotovo! 💪';
    timeEl.textContent = '0';
    barEl.style.width = '100%';
    dots.forEach(d => { d.classList.add('done'); d.classList.remove('active'); });
    mainBtn.textContent = 'Začít další cyklus';
    mainBtn.hidden = false;
    resetBtn.hidden = true;
  }
}

function startCycle() {
  unlockAudio();
  index = 0;
  running = true;
  mainBtn.hidden = true;
  resetBtn.hidden = false;
  startStep();
}

function reset() {
  if (ticker) clearInterval(ticker);
  ticker = null;
  running = false;
  stopSilentLoop();
  index = 0;
  barEl.style.width = '0%';
  render(WORK, null);
  mainBtn.textContent = 'Začít cyklus';
  mainBtn.hidden = false;
  resetBtn.hidden = true;
}

if (isApple) {
  document.getElementById('hint').textContent =
    'iPhone: přepni boční přepínač na zvonění, jinak systém pípání ztlumí.';
}

mainBtn.addEventListener('click', startCycle);
resetBtn.addEventListener('click', reset);
render(WORK, null);
</script>
</body>
</html>
